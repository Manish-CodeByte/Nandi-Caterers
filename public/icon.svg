<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="38%" fy="38%">
      <stop offset="0%" stop-color="#7B2337"/>
      <stop offset="65%" stop-color="#641C2D"/>
      <stop offset="100%" stop-color="#42121E"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="25%" stop-color="#F5DC8C"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9C7829"/>
    </linearGradient>
  </defs>

  <!-- Circular Royal Burgundy Medallion with transparent corners -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" />

  <!-- Outer Ornate Gold Border Rings -->
  <circle cx="50" cy="50" r="45.5" stroke="url(#goldGrad)" stroke-width="2.2" fill="none" />
  <circle cx="50" cy="50" r="42" stroke="url(#goldGrad)" stroke-width="0.9" stroke-dasharray="2.5 1.5" fill="none" opacity="0.9" />

  <!-- 4 Cardinal Gold Accents -->
  <polygon points="50,4 48,8 52,8" fill="url(#goldGrad)" />
  <polygon points="50,96 48,92 52,92" fill="url(#goldGrad)" />
  <polygon points="4,50 8,48 8,52" fill="url(#goldGrad)" />
  <polygon points="96,50 92,48 92,52" fill="url(#goldGrad)" />

  <!-- Lotus Pedestal Base -->
  <path d="M22 75 C32 72 42 71 50 71 C58 71 68 72 78 75 C75 78 66 80 50 80 C34 80 25 78 22 75Z" fill="url(#goldGrad)" opacity="0.75" />
  <path d="M24 74.5 Q50 68.5 76 74.5" stroke="url(#goldGrad)" stroke-width="1.8" fill="none" stroke-linecap="round" />

  <!-- Sacred Nandi Bull Body -->
  <path d="M27 69 C25 63 29 57 35 55 C37 52 40 46 44 42 C46 38 48 33 52 32 C56 31 59 34 60 38 C63 38 67 40 69 44 C72 48 74 54 73 62 C73 66 71 69 68 70 C62 71 56 71 50 71 C42 71 33 71 27 69Z" fill="url(#goldGrad)" />

  <!-- Sacred Hump (Kakud) -->
  <path d="M43 43 C41 34 47 28 52 30 C54 32 55 38 55 42 Z" fill="url(#goldGrad)" />

  <!-- Regal Head -->
  <path d="M59 38 C62 36 67 36 71 39 C73 41 74 44 73 47 C71 49 68 50 65 48 C62 46 60 42 59 38Z" fill="url(#goldGrad)" />

  <!-- Curved Horns -->
  <path d="M62 37 C64 29 67 21 72 20 C72 25 70 30 66 36 Z" fill="url(#goldGrad)" />
  <path d="M58 36 C59 28 61 22 65 19 C65 24 63 29 61 35 Z" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Ear -->
  <path d="M56 40 C53 41 52 44 54 45 C56 45 58 43 58 41 Z" fill="url(#goldGrad)" />

  <!-- Ceremonial Bell Collar / Garland -->
  <path d="M59 46 Q64 51 68 53" stroke="#FFF5D6" stroke-width="2" stroke-linecap="round" fill="none" />
  <circle cx="60.5" cy="48" r="1.8" fill="#FFF5D6" />
  <circle cx="64" cy="50.5" r="2.1" fill="#FFF5D6" />
  <circle cx="67.5" cy="52.8" r="1.8" fill="#FFF5D6" />

  <!-- Ornamental Jhula / Blanket -->
  <path d="M38 56 C43 54 52 54 57 56 C57 62 55 65 48 66 C41 65 38 61 38 56Z" fill="#380F19" opacity="0.8" stroke="url(#goldGrad)" stroke-width="1.3" />
  <!-- Fringe -->
  <path d="M40 64 L40 66.5 M43.5 65 L43.5 67.5 M47.5 66 L47.5 68.5 M51.5 65 L51.5 67.5 M55 64 L55 66.5" stroke="url(#goldGrad)" stroke-width="1.3" stroke-linecap="round" />

  <!-- Eye Accent -->
  <circle cx="68.5" cy="41" r="1.3" fill="#380F19" />
  <!-- Forehead Sacred Tilak -->
  <path d="M69 36.5 L70.5 34 L72 36.5 Z" fill="#FFF5D6" />
</svg>